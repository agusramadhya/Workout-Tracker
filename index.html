<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Workout Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Workout Tracker" />
    <link rel="manifest" href="/site.webmanifest" />
    
</head>

<body>

<div class="background"></div>

<div class="container">

    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <header>

        <div>

            <h1>Workout Tracker</h1>

            <p id="todayDate"></p>

        </div>

        <div class="toolbar">

            <button id="themeBtn"
                    class="toolbar-btn">

                🌙

            </button>

            <button id="printBtn"
                    class="toolbar-btn">

                🖨

            </button>

            <button id="resetBtn"
                    class="toolbar-btn danger">

                ↺

            </button>

            <input
                type="file"
                id="importFile"
                accept=".json"
                hidden>

        </div>

    </header>


    <!-- ========================= -->
    <!-- Dashboard -->
    <!-- ========================= -->

    <section class="dashboard">

        <div class="stat-card">

            <span>Completed</span>

            <h2 id="completed">

                0

            </h2>

            <div class="progress-line">

                <div id="completedLine"></div>

            </div>

        </div>

        <div class="stat-card">

            <span>Remaining</span>

            <h2 id="remaining">

                0

            </h2>

        </div>

        <div class="stat-card">

            <span>Progress</span>

            <h2 id="progress">

                0%

            </h2>

            <div class="progress-line">

                <div id="progressLine"></div>

            </div>

        </div>

        <div class="stat-card">

            <span>Current Streak</span>

            <h2 id="streak">

                🔥 0

            </h2>

            <small id="longest">

                Longest: 0

            </small>

        </div>

    </section>


    <!-- ========================= -->
    <!-- Attendance -->
    <!-- ========================= -->

    <section class="panel">

        <div class="section-title">

            <div>

                <h2>Workout Attendance</h2>

                <p>Click a circle after completing your workout.</p>

            </div>

        </div>

        <div id="calendar"></div>

    </section>


    <!-- ========================= -->
    <!-- Workout Schedule -->
    <!-- ========================= -->

    <section class="panel">

        <div class="section-title">

            <div>

                <h2>Workout Schedule</h2>

                <p>Everything is automatically saved.</p>

            </div>

        </div>

        <div id="schedule"
             class="schedule-grid">

        </div>

    </section>

</div>

<div id="statusMenu" class="status-menu">

    <button data-status="done">
        ✅ Workout
    </button>

    <button data-status="rest">
        🛌 Rest Day
    </button>

    <button data-status="clear">
        ⭕ Clear
    </button>

</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>

</body>

</html>
